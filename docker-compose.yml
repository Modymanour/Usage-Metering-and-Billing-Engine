services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: BillingEngine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BillingEngine"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      POSTGRESQL_CONNECTION_STRING: postgres://postgres:dev@db:5432/BillingEngine
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  postgres_data: