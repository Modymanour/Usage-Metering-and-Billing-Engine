services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BillingEngine"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: modymansour/usage-billing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      POSTGRESQL_CONNECTION_STRING: ${POSTGRESQL_CONNECTION_STRING}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  postgres_data: