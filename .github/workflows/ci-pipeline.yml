name: Continuous Integration

on:
  push:
    ['master']
  pull_request:
    ['master']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRESQL_CONNECTION_STRING: postgres://postgres:dev@localhost:5432/BillingEngine
      TEST_DATABASE_URL: postgres://postgres:dev@localhost:5432/BillingEngine
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: BillingEngine
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d BillingEngine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
